[package]
name = "payee-lock"
version = "0.1.0"
edition = "2021"
description = "Open payee registry with contract-enforced time locks on address changes"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# The wasm artifact is payee_lock.wasm.

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
